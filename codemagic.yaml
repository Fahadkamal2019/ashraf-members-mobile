workflows:
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 60
    environment:
      groups:
        - firebase_android
      android_signing:
        - ashraf_android_keystore
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Write google-services.json from secure variable
        script: echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > android/app/google-services.json
      - name: Install Android SDK Platform 37
        script: |
          SDKMANAGER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-37"
      - name: Build appbundle
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ashraf-members-asc
    environment:
      groups:
        - firebase_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.niqabatalashraaf.ashrafMembersMobile
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Write GoogleService-Info.plist from secure variable
        script: echo $GOOGLE_SERVICE_INFO_PLIST_BASE64 | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
